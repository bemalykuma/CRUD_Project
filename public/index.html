<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student CRUD</title>
  <style>
    * { box-sizing: border-box; border-radius: 0; }
    body { font-family: monospace; background: #fff; color: #000; max-width: 900px; margin: 20px auto; padding: 0 16px; }
    h1 { border-bottom: 3px solid #000; padding-bottom: 8px; }
    form { border: 2px solid #000; padding: 12px; margin-bottom: 20px; }
    label { display: block; margin-top: 8px; }
    input, select { width: 100%; padding: 6px; border: 2px solid #000; font-family: monospace; background: #fff; }
    button { margin-top: 12px; padding: 6px 14px; border: 2px solid #000; background: #fff; font-family: monospace; cursor: pointer; }
    button:hover, button.primary { background: #000; color: #fff; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 2px solid #000; padding: 6px; text-align: left; }
    th { background: #000; color: #fff; }
    td button { margin: 0; padding: 2px 8px; }
  </style>
</head>
<body>
  <h1>ข้อมูลนักศึกษา</h1>

  <form id="form">
    <b id="formTitle">เพิ่มนักศึกษา</b>
    <input type="hidden" id="id">
    <label>รหัสประจำตัว <input id="studentId" required placeholder="67070148"></label>
    <label>ชื่อ <input id="firstName" required></label>
    <label>นามสกุล <input id="lastName" required></label>
    <label>วันเกิด <input id="birthDate" type="date" required></label>
    <label>เพศ
      <select id="gender">
        <option value="male">ชาย</option>
        <option value="female">หญิง</option>
        <option value="other">อื่น ๆ</option>
      </select>
    </label>
    <button type="submit" class="primary">บันทึก</button>
    <button type="button" onclick="resetForm()">ยกเลิก</button>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>รหัส</th><th>ชื่อ</th><th>นามสกุล</th><th>วันเกิด</th><th>เพศ</th><th></th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>

  <script>
    const API = "/api/v1/students";
    const genderText = { male: "ชาย", female: "หญิง", other: "อื่น ๆ" };
    let students = [];

    // READ
    async function loadStudents() {
      const res = await fetch(API);
      students = await res.json();
      document.getElementById("list").innerHTML = students.map(s => `
        <tr>
          <td>${s.studentId}</td>
          <td>${s.firstName}</td>
          <td>${s.lastName}</td>
          <td>${s.birthDate}</td>
          <td>${genderText[s.gender]}</td>
          <td>
            <button onclick="editStudent(${s.id})">แก้ไข</button>
            <button onclick="removeStudent(${s.id})">ลบ</button>
          </td>
        </tr>`).join("");
    }

    // CREATE / UPDATE
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("id").value;
      const data = {
        studentId: document.getElementById("studentId").value,
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        birthDate: document.getElementById("birthDate").value,
        gender: document.getElementById("gender").value,
      };

      const res = await fetch(id ? `${API}/${id}` : API, {
        method: id ? "PATCH" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      if (!res.ok) {
        const err = await res.json();
        alert("Error: " + (err.error.message || err.error));
        return;
      }

      resetForm();
      loadStudents();
    });

    function editStudent(id) {
      const s = students.find(x => x.id === id);
      document.getElementById("formTitle").textContent = "แก้ไขนักศึกษา";
      document.getElementById("id").value = s.id;
      document.getElementById("studentId").value = s.studentId;
      document.getElementById("firstName").value = s.firstName;
      document.getElementById("lastName").value = s.lastName;
      document.getElementById("birthDate").value = s.birthDate;
      document.getElementById("gender").value = s.gender;
    }

    // DELETE
    async function removeStudent(id) {
      if (!confirm("ลบจริงไหม?")) return;
      await fetch(`${API}/${id}`, { method: "DELETE" });
      loadStudents();
    }

    function resetForm() {
      document.getElementById("form").reset();
      document.getElementById("id").value = "";
      document.getElementById("formTitle").textContent = "เพิ่มนักศึกษา";
    }

    loadStudents();
  </script>
</body>
</html>
